name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so Claude can create a branch and push commits
      pull-requests: write # Required so Claude can open a pull request
      issues: write # Required so Claude can comment back on the issue
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Custom prompt: read the GitHub issue that triggered this run, implement
          # the requested change, and open a pull request with the result.
          prompt: |
            You were tagged with @claude on a GitHub ${{ github.event_name }} event in ${{ github.repository }}.

            1. Determine the relevant issue or pull request number from the event
               context and read its full description/comments (e.g. `gh issue view <number>`
               or `gh pr view <number>`) to understand what is being asked.
            2. If this is about an open issue (not an existing PR), implement the
               requested change in the codebase:
               - Create a new branch off the default branch, e.g.
                 `claude/issue-<number>-<short-slug>`.
               - Make the code changes and commit them with a clear, conventional
                 commit message.
               - Push the branch and open a pull request with `gh pr create`,
                 summarizing the change and including `Fixes #<number>` in the body.
            3. If you were instead tagged on an existing pull request (via a review
               or PR comment), apply the requested changes directly to that PR's
               branch and push the update instead of opening a new PR.
            4. Reply in the original thread with a short summary and a link to the
               PR you opened or updated.

          # Allow Claude to run the git/gh commands needed to create a branch,
          # push commits, and open a pull request.
          claude_args: |
            --allowedTools "Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr comment:*)"

